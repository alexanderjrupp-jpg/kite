<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Kite v2</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<meta name="theme-color" content="#5141C9">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#F7F6FB; --bgfx:none;
    --panel:#FFFFFF; --border:#D9D6E6; --soft:#EFEDF6;
    --text:#1F1A33; --muted:#5B5670; --accent:#5141C9; --accent2:#5141C9; --accent3:#14B8A6;
    --accsoft:rgba(81,65,201,.10);
    --sentbg:#FFFFFF; --sentborder:#D9D6E6;
    --tipbg:#F1EEFF; --tipborder:#D6CFFA;
    --good:#2F8A3C; --bad:#C0392B; --chip:#FFFFFF; --empty:#E7E4F0; --emptyedit:#A9A4BD;
    --shadow:0 1px 2px rgba(31,26,51,.10);
    --surface:transparent; --surfborder:transparent; --glass:#FFFFFF;
    --ambient:none;
    --kitetail:#22306E;
  }
  body.dark {
    --bg:#12141D; --bgfx:linear-gradient(160deg,#131522 0%,#1C1530 55%,#121A28 100%);
    --panel:#1B1E2B; --border:#2D3143; --soft:#252939;
    --text:#E9EBF4; --muted:#9BA2B6; --accent:#8B7CF7; --accent2:#F472B6; --accent3:#2DD4BF;
    --accsoft:rgba(139,124,247,.16);
    --sentbg:#1B1E2B; --sentborder:#2D3143;
    --tipbg:#2F2A1E; --tipborder:#4C4531;
    --good:#5BBF6A; --bad:#E07060; --chip:#252939; --empty:#2B2F42; --emptyedit:#4C5375;
    --shadow:0 2px 6px rgba(0,0,0,.45);
    --surface:rgba(27,30,43,.55); --surfborder:rgba(255,255,255,.07); --glass:rgba(37,41,57,.75);
    --ambient:0 3px 10px rgba(0,0,0,.35);
    --kitetail:#8DA2F2;
  }
  body.hc {
    --bg:#ffffff; --bgfx:none; --panel:#ffffff; --border:#000000; --soft:#e6e6e6;
    --text:#000000; --muted:#000000; --accent:#0000cc; --accent2:#a00050; --accent3:#006b5e;
    --accsoft:#d9d9ff;
    --sentbg:#ffffff; --sentborder:#000000; --tipbg:#ffffff; --tipborder:#000000;
    --good:#006b00; --bad:#a00000; --chip:#ffffff; --empty:#ffffff; --emptyedit:#000000;
    --shadow:none; --surface:#ffffff; --surfborder:#000000; --glass:#ffffff;
    --ambient:none; --kitetail:#000000;
  }
  body.hc #gridwrap { background:#ffffff; }
  body.hc #grid { gap:9px; }
  body.hc .cell:not(.empty) { background:#fff !important; border:3px solid #000 !important; }
  body.hc .cell .lab { color:#000; font-weight:700; }
  body.hc .cell .foldmark, body.hc .cell .editmark { color:#000; }
  body.hc #sent .chip { background:#fff !important; border:2px solid #000; color:#000; }
  /* ===== CVI mode: black field, high luminance contrast, minimal color (for cortical visual impairment) ===== */
  body.cvi {
    --bg:#000000; --bgfx:none; --panel:#000000; --border:#ffffff; --soft:#161616;
    --text:#ffffff; --muted:#cfcfcf; --accent:#ffe000; --accent2:#ffe000; --accent3:#ffe000;
    --accsoft:#333300; --sentbg:#000000; --sentborder:#ffffff; --tipbg:#111111; --tipborder:#ffffff;
    --good:#00e000; --bad:#ff6060; --chip:#000000; --empty:#000000; --emptyedit:#888888;
    --shadow:none; --surface:#000000; --surfborder:#333333; --glass:#000000; --ambient:none; --kitetail:#ffffff;
  }
  body.cvi #gridwrap { background:#000; }
  body.cvi #grid { gap:12px; }
  body.cvi .cell:not(.empty) { background:#000 !important; border:3px solid #fff !important; }
  body.cvi .cell .lab { color:#fff; font-weight:700; }
  body.cvi .cell .foldmark, body.cvi .cell .editmark { color:#fff; }
  body.cvi #sent { background:#000; }
  body.cvi #sent .chip { background:#000 !important; border:2px solid #fff; color:#fff; }
  body.cvi #navbar, body.cvi #botbar, body.cvi #topbar { background:#000; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; padding:0; height:100%; overflow:hidden;
    font-family:"Atkinson Hyperlegible",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:var(--bg); background-image:var(--bgfx); background-attachment:fixed;
    color:var(--text); -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none; transition:background .25s; }
  #app { display:flex; flex-direction:column; height:100%;
    padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
    padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right); }

  /* Sentence bar */
  #topbar { display:flex; align-items:stretch; gap:6px; padding:10px 10px 4px; background:transparent; }
  #sent { flex:1; min-height:64px; display:flex; align-items:center; gap:6px; overflow-x:auto; padding:4px 10px; background:var(--sentbg); border:1px solid var(--sentborder); border-radius:14px; }
  #sent .chip { flex:0 0 auto; display:flex; flex-direction:column; align-items:center; padding:3px 8px; background:var(--chip); border:none; border-radius:12px; font-size:12px; cursor:pointer; max-width:90px; box-shadow:0 2px 0 var(--edge, var(--border)); }
  #sent .chip img { width:26px; height:26px; object-fit:contain; }
  #sent .chip .em { font-size:22px; line-height:26px; }
  #sent .hint { color:var(--muted); font-size:15px; }
  .tbtn { border:1px solid var(--border); min-width:58px; padding:0 14px; border-radius:14px; font-size:20px; background:var(--panel); color:var(--text); cursor:pointer; font-family:inherit; }
  .tbtn:active { filter:brightness(.92); transform:translateY(1px); }
  #spk { background:var(--accent); border-color:var(--accent); color:#fff; font-size:17px; font-weight:700; padding:0 22px; }

  /* Nav bar */
  #navbar { display:flex; align-items:center; gap:8px; padding:6px 14px; background:transparent; color:var(--text); }
  #brand { display:flex; align-items:center; gap:6px; margin-right:2px; }
  #brand span { font-size:17px; font-weight:700; letter-spacing:.3px; color:var(--accent); }
  #lvBadge { font-size:12px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--accent); background:var(--accsoft); border-radius:999px; padding:4px 10px; }
  #brand svg { transform:rotate(8deg); }
  #navbar button { border:1px solid var(--border); background:var(--panel); color:var(--text); border-radius:12px; padding:7px 14px; font-size:15px; font-weight:700; cursor:pointer; font-family:inherit; }
  #crumb { font-size:18px; font-weight:700; flex:1; text-align:center; color:var(--text); }
  #enote { font-size:12px; color:var(--muted); display:none; }

  /* Grid — color-coded tiles on a flat field (matches the layout canvas) */
  #gridwrap { flex:1; overflow:hidden; padding:4px 12px 6px; }
  #grid { display:grid; gap:8px; height:100%; }
  #grid.big { gap:16px; max-width:min(100%, 120vh); margin:0 auto; }
  .cell { position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    cursor:pointer; text-align:center; overflow:hidden; padding:4px 3px 5px; min-width:0; min-height:0;
    background:var(--tile, var(--panel)); border:2px solid var(--edge, var(--border)); border-radius:12px;
    transition:transform .08s, filter .08s; }
  .cell.folder { border-top-width:6px; }
  .cell:active { transform:scale(.96); filter:brightness(.95); }
  .cell .pic { flex:1; width:100%; min-height:0; display:flex; align-items:center; justify-content:center; }
  .cell .pic img { max-width:80%; max-height:100%; object-fit:contain; }
  .cell .pic .em { font-size:clamp(14px,3.6vmin,32px); line-height:1; }
  .cell .lab { font-size:clamp(10px,1.9vmin,17px); font-weight:700; line-height:1.15; width:100%; color:var(--text);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #grid.big .cell { border-width:3px; border-radius:20px; gap:6px; }
  #grid.big .cell .pic .em { font-size:clamp(36px,11vmin,96px); }
  #grid.big .cell .lab { font-size:clamp(18px,4vmin,36px); }
  .cell.empty { cursor:default; background:transparent; border:2px solid transparent; }
  .cell.empty:active { transform:none; filter:none; }
  .cell.empty.editing { border:2px dashed var(--emptyedit); cursor:pointer; }
  .cell.empty.editing::after { content:"+"; color:var(--emptyedit); font-size:22px; }
  .cell.locked { opacity:.4; border-style:dashed; }
  .cell .lvtag { position:absolute; top:3px; right:5px; font-size:10px; font-weight:700; color:#fff; background:#1F1A33; border-radius:5px; padding:0 4px; }
  .cell .foldmark { display:none; }
  .cell .editmark { position:absolute; top:3px; left:6px; font-size:11px; color:var(--muted); display:none; }
  body.editing .cell .editmark { display:block; }
  body.editing .cell { touch-action:none; }
  body.editing #gridwrap { touch-action:none; overscroll-behavior:contain; }
  /* level picker (Settings) */
  .lvpick { display:flex; flex-direction:column; gap:6px; }
  .lvpick button { text-align:left; border:1px solid var(--border); background:var(--panel); color:var(--text); border-radius:12px; padding:10px 12px; cursor:pointer; font-family:inherit; display:flex; flex-direction:column; gap:2px; }
  .lvpick button b { font-size:15px; }
  .lvpick button span { font-size:13px; color:var(--muted); }
  .lvpick button.on { border:2px solid var(--accent); background:var(--accsoft); }

  /* Bottom bar */
  #botbar { display:flex; align-items:center; gap:8px; padding:4px 14px 8px; background:transparent; }
  #botbar button { border:1px solid var(--border); background:var(--panel); border-radius:12px; padding:8px 16px; font-size:15px; font-weight:700; cursor:pointer; color:var(--text); font-family:inherit; }
  #edit.on { background:var(--accent); color:#fff; border-color:var(--accent); }

  /* Overlay / dialogs */
  #ov { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(10,12,22,.55); display:none; align-items:center; justify-content:center; padding:14px; z-index:50; }
  #ov.show { display:flex; }
  #ovbox { width:100%; max-width:420px; max-height:92vh; overflow-y:auto; background:var(--panel); color:var(--text); border-radius:20px; padding:18px; -webkit-user-select:auto; user-select:auto; }
  #ovbox h3 { margin:0 0 6px; font-size:18px; }
  #ovbox .sub { margin:0 0 12px; color:var(--muted); font-size:13px; }
  #ovbox label { display:block; font-size:13px; font-weight:600; color:var(--muted); margin:10px 0 4px; }
  #ovbox input[type=text], #ovbox input[type=password], #ovbox select, #ovbox textarea {
    width:100%; padding:10px; border:1px solid var(--border); border-radius:12px; font-size:16px; background:var(--panel); color:var(--text); }
  #ovbox input[type=range] { width:100%; accent-color:var(--accent); }
  .btnrow { display:flex; gap:8px; margin-top:14px; }
  .btn { flex:1; border:none; border-radius:12px; padding:12px; font-size:15px; font-weight:700; cursor:pointer; background:var(--soft); color:var(--text); font-family:inherit; }
  .btn.primary { background:var(--accent); color:#fff; }
  .btn.danger { background:rgba(192,57,43,.12); color:var(--bad); }
  .btn.ghost { background:var(--panel); border:1px solid var(--border); }
  .swatches { display:flex; flex-wrap:wrap; gap:6px; }
  .swatches .sw { width:34px; height:34px; border-radius:10px; cursor:pointer; border:2px solid transparent; }
  .swatches .sw.sel { border-color:var(--accent); }
  .tabs { display:flex; gap:4px; background:var(--soft); padding:4px; border-radius:12px; margin:6px 0 8px; }
  .tabs button { flex:1; border:none; padding:8px; border-radius:9px; font-weight:600; font-size:13px; cursor:pointer; background:transparent; color:var(--muted); }
  .tabs button.on { background:var(--panel); color:var(--text); box-shadow:var(--shadow); }
  #sres { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; max-height:180px; overflow-y:auto; margin-top:8px; }
  #sres button { border:1px solid var(--border); border-radius:12px; background:#fff; cursor:pointer; aspect-ratio:1; padding:4px; display:flex; align-items:center; justify-content:center; }
  #sres img { max-width:100%; max-height:100%; }
  /* read-along guide */
  #guidebar { display:none; align-items:center; gap:10px; margin:0 10px 4px; padding:8px 14px; background:var(--tipbg); border:1px solid var(--tipborder); border-radius:14px; font-size:14px; font-weight:600; }
  #guidebar .gword { font-size:17px; font-weight:800; color:var(--accent); }
  #guidebar button { margin-left:auto; border:none; background:var(--glass); border-radius:999px; padding:6px 12px; font-weight:700; cursor:pointer; color:var(--text); }
  .cell.guide-glow { outline:4px solid var(--accent); outline-offset:2px; animation:tbglow 1.1s ease-in-out infinite; }
  #homeBtn.guide-glow { outline:3px solid var(--accent); animation:tbglow 1.1s ease-in-out infinite; }
  @keyframes tbglow {
    0%,100% { transform:scale(1); box-shadow:0 2px 0 var(--edge,transparent), 0 0 0 0 rgba(108,92,231,.45); }
    50%     { transform:scale(1.07); box-shadow:0 2px 0 var(--edge,transparent), 0 0 16px 5px rgba(108,92,231,.35); }
  }
  #spkeys .spk2 { flex:1; max-width:44px; min-width:26px; padding:11px 0; font-size:17px; font-weight:700; border:1px solid var(--tipborder); border-radius:10px; background:var(--tipbg); color:var(--text); cursor:pointer; }
  #spkeys .spk2:active { filter:brightness(.9); }
  .pinpad { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:8px; }
  .pinpad button { padding:14px; font-size:20px; font-weight:600; border:1px solid var(--border); border-radius:14px; background:var(--panel); color:var(--text); cursor:pointer; }
  .note { font-size:12px; color:var(--muted); margin-top:8px; }
  @media (max-width: 620px){
    #grid { grid-template-columns: repeat(12, minmax(52px, 1fr)) !important;
            grid-template-rows: repeat(7, minmax(60px, auto)) !important;
            height: auto !important; width: max-content; min-width: 100%; }
    #gridwrap { overflow: auto !important; -webkit-overflow-scrolling: touch; margin:2px 6px 4px; padding:6px; }
    #brand span { display: none; }
    #navbar { flex-wrap: wrap; gap: 5px; padding: 5px 8px; }
    #navbar button { padding: 6px 10px; font-size: 13px; }
    #enote { display: none !important; }
    #botbar { flex-wrap: wrap; gap: 5px; padding: 4px 8px 8px; }
    #botbar button { padding: 7px 11px; font-size: 13px; }
    .tbtn { min-width: 44px; padding: 0 10px; font-size: 18px; }
    #sent { min-height: 52px; }
    .cell .pic .em { font-size: 23px; }
    .cell .lab { font-size: 10px; }
  }
  #toast { position:fixed; left:50%; bottom:70px; transform:translateX(-50%); background:var(--text); color:var(--bg); padding:10px 18px; border-radius:999px; font-size:14px; display:none; z-index:60; max-width:90vw; text-align:center; box-shadow:var(--shadow); }
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div id="sent"></div>
    <button class="tbtn" id="bsp" title="Backspace">⌫</button>
    <button class="tbtn" id="clr" title="Clear">✕</button>
    <button class="tbtn" id="spk">▶ Speak</button>
  </div>
  <div id="navbar">
    <div id="brand" title="Kite — every voice, lifted">
      <svg width="19" height="27" viewBox="0 0 24 34" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 1 L21.5 11 L12 21 L2.5 11 Z" fill="var(--accent)"/>
        <path d="M12 1 L12 21 M2.5 11 L21.5 11" stroke="rgba(255,255,255,.55)" stroke-width="1.2"/>
        <path d="M12 21 C 9.5 24.5, 15 26.5, 12.5 30.5" stroke="var(--kitetail)" stroke-width="1.6" fill="none" stroke-linecap="round"/>
        <path d="M10.2 24.2 l1.7 -1.1 l0.2 2z" fill="var(--kitetail)"/>
        <path d="M13.9 28 l1.8 -0.8 l-0.1 2z" fill="var(--kitetail)"/>
      </svg>
      <span>Kite</span>
    </div>
    <span id="lvBadge">Level 2</span>
    <button id="homeBtn">⌂ Home</button>
    <button id="backBtn" style="display:none">‹ Back</button>
    <div id="crumb">Home</div>
    <span id="enote">Edit mode: tap a button to change it, tap an empty cell to add</span>
    <button id="wfBtn" title="Word finder">🔍</button>
    <button id="volBtn" title="Volume">🔊</button>
    <button id="themeBtn" title="Light / dark">🌙</button>
    <button id="setBtn">⚙</button>
  </div>
  <div id="guidebar"></div>
  <div id="gridwrap"><div id="grid"></div></div>
  <div id="botbar">
    <button id="edit">🔒 Edit</button>
    <div style="flex:1"></div>
    <span id="syncst" style="font-size:11px;color:var(--good);margin-right:8px"></span>
    <div style="font-size:11px;color:var(--muted)">Symbols © ARASAAC (CC BY-NC-SA), Gov. of Aragón</div>
  </div>
</div>
<div id="ov"><div id="ovbox"></div></div>
<div id="toast"></div>
<input type="file" id="photoIn" accept="image/*" style="display:none">
<input type="file" id="importIn" accept=".json,application/json" style="display:none">

<script>
window.onerror = function(msg, src, line){
  try {
    var d = document.createElement("div");
    d.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:999;background:#c0392b;color:#fff;font:13px sans-serif;padding:8px 12px;text-align:center";
    d.textContent = "Kite hit an error — tell Claude: " + msg + " (line " + line + ")";
    document.body.appendChild(d);
  } catch(e){}
};
(function(){
"use strict";
/* ============================================================
   KITE — single-file AAC app.  Section map (search these tags):
     [CONFIG]     Firebase config, device identity
     [BOARDS]     starter board data (Levels 1–3)
     [STATE]      board state, storage (localStorage + IndexedDB)
     [SPEECH]     TTS, recorded-audio playback
     [GRAMMAR]    suffix + irregular handling
     [RENDER]     board render, sentence bar
     [KEYBOARD]   spell keyboard modes
     [EDIT]       button editor, drag-and-drop
     [SYMBOLS]    ARASAAC search + bulk
          [PRACTICE]   word finder
     [REPORTS]    weekly / detailed / remote + shared UI
     [SETTINGS]   settings dialog
     [SYNC]       Firebase board sync, accounts
     [INIT]       boot + service worker
   ============================================================ */
var LS_KEY = "kite2_board";
var ROWS = 7, COLS = 12;

/* ---------- palette ---------- */
/* [light bg, light border, dark bg, dark border] */
var PAL = {
  w:  ["#FFFFFF","#A9A4BD","#262b38","#3d4456"],   /* little words      */
  y:  ["#FFE58F","#C79C00","#4d431d","#7a6a2c"],   /* people / pronouns */
  g:  ["#BDEBC5","#3E9B52","#26421d","#427037"],   /* action words      */
  b:  ["#C6DDFF","#3B74D1","#20344c","#38587e"],   /* describing words  */
  o:  ["#FFD6AD","#C96F1E","#4a341a","#775530"],   /* folders           */
  p:  ["#FFD3E6","#C9437F","#43253a","#6c3f5f"],   /* social            */
  pu: ["#E0D1FF","#7B52D6","#352947","#554273"],   /* questions         */
  t:  ["#BDEEE6","#2E9C8A","#1e3d39","#33645b"],   /* go back           */
  r:  ["#FFC9C3","#C1362B","#47261c","#714035"],   /* negation / stop   */
  gr: ["#E4E2EC","#6E6A82","#2b303c","#414857"]    /* grammar, keyboard */
};
function palColors(key){
  var col = PAL[key] || PAL.w;
  var dark = dev && dev.theme === "dark";
  return [ dark ? col[2] : col[0], dark ? col[3] : col[1] ];
}

/* ---------- builders ---------- */
/* lv = lowest board level a button appears at (2 or 3). Level 1 has its own 3x3 page. */
function W(l,e,c,s,lv){ return {t:"w", l:l, e:e||"⬜", c:c||"w", s:s||null, img:null, lv:lv||3}; }
function F(l,e,tg,c,lv){ return {t:"f", l:l, e:e||"📁", c:c||"o", tg:tg, sp:false, img:null, lv:lv||3}; }
function G(l,sfx){ return {t:"g", l:l, e:"🧩", c:"gr", sfx:sfx, img:null, lv:3}; }
function BACK(){ return {t:"a", l:"GO BACK", e:"⬅️", c:"t", a:"back", img:null, lv:2}; }
function SPELL(){ return {t:"a", l:"ABC", e:"🔤", c:"gr", a:"spell", img:null, lv:3}; }
/* level-2 word shorthand */
function W2(l,e,c){ return W(l,e,c,null,2); }

function pageDims(p){ return { c: (p && p.cols) || COLS, r: (p && p.rows) || ROWS }; }
function rowsToCells(rows, cols){
  var cells = {}, nc = cols || COLS;
  for (var r=0; r<rows.length; r++){
    for (var c=0; c<rows[r].length; c++){
      if (rows[r][c]) cells[r*nc+c] = rows[r][c];
    }
  }
  return cells;
}
function page(name, rows){ return { name:name, cells: rowsToCells(rows) }; }
function stubPage(name){ return { name:name, cells: { 0: BACK() } }; }

/* ---------- starter board: one board, three levels ----------
   Level 3 = everything. Level 2 = buttons tagged lv:2 (Universal Core 36 + yes/no + 6 folders).
   Level 1 = its own big-button page ("l1"). Switching levels never deletes anything. */
function starterBoard(){

/* ---------- durable storage mirror (IndexedDB survives iOS cache cleanups) ---------- */
var idb = null;
function idbOpen(cb){
  if (!window.indexedDB){ cb(null); return; }
  try {
    var req = indexedDB.open("kite2_db", 1);
    req.onupgradeneeded = function(){ req.result.createObjectStore("kv"); };
    req.onsuccess = function(){ idb = req.result; cb(idb); };
    req.onerror = function(){ cb(null); };
  } catch(e){ cb(null); }
}
function idbSet(key, val){
  if (!idb) return;
  try { idb.transaction("kv", "readwrite").objectStore("kv").put(val, key); } catch(e){}
}
function idbGet(key, cb){
  if (!idb){ cb(null); return; }
  try {
    var rq = idb.transaction("kv", "readonly").objectStore("kv").get(key);
    rq.onsuccess = function(){ cb(rq.result || null); };
    rq.onerror = function(){ cb(null); };
  } catch(e){ cb(null); }
}

/* ---------- speech ---------- */
var SPELL_OK = { "TV":1, "OK":1, "DVD":1, "ABC":1 };   /* things that SHOULD be spelled out */
function fixSpeech(t){
  return String(t).split(" ").map(function(w){
    var core = w.replace(/[^A-Za-z]/g, "");
    if (core.length > 1 && core === core.toUpperCase() && !SPELL_OK[core]) return w.toLowerCase();
    return w;
  }).join(" ");
}
var voices = [];
function loadVoices(){ voices = window.speechSynthesis ? speechSynthesis.getVoices() : []; }
if (window.speechSynthesis){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
/* ===== [SPEECH] ===== */
function speak(text){
  if (!text || !window.speechSynthesis) return;
  try {
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(fixSpeech(text));
    u.rate = board.settings.rate; u.pitch = board.settings.pitch; u.volume = (board.settings.vol === undefined ? 1 : board.settings.vol);
    if (board.settings.voice){
      for (var i=0;i<voices.length;i++){ if (voices[i].name === board.settings.voice){ u.voice = voices[i]; break; } }
    }
    speechSynthesis.speak(u);
  } catch(e){}
}
function speakAsync(text, cb){
  if (!text || !window.speechSynthesis){ if (cb) setTimeout(cb, 0); return; }
  try {
    var u = new SpeechSynthesisUtterance(fixSpeech(text));
    u.rate = board.settings.rate; u.pitch = board.settings.pitch; u.volume = (board.settings.vol === undefined ? 1 : board.settings.vol);
    if (board.settings.voice){
      for (var i=0;i<voices.length;i++){ if (voices[i].name === board.settings.voice){ u.voice = voices[i]; break; } }
    }
    var done = false;
    function fin(){ if (!done){ done = true; if (cb) cb(); } }
    u.onend = fin; u.onerror = fin;
    setTimeout(fin, 4000 + text.length * 90);   /* safety net */
    speechSynthesis.speak(u);
  } catch(e){ if (cb) setTimeout(cb, 0); }
}
/* plays a sequence of sentence items: recorded audio where available, TTS otherwise */
function playItems(items){
  if (!items.length) return;
  try { speechSynthesis.cancel(); } catch(e){}
  var i = 0, ttsRun = [];
  function flushTts(cb){
    if (!ttsRun.length){ cb(); return; }
    var txt = ttsRun.join(" "); ttsRun = [];
    speakAsync(txt, cb);
  }
  function next(){
    if (i >= items.length){ flushTts(function(){}); return; }
    var it = items[i++];
    if (it.au){
      flushTts(function(){
        var a = new Audio(it.au);
        a.volume = (board.settings.vol === undefined ? 1 : board.settings.vol);
        a.onended = next; a.onerror = next;
        var p = a.play(); if (p && p.catch) p.catch(next);
      });
    } else { ttsRun.push(it.say); next(); }
  }
  next();
}

var IRR = {
  s:  { child:"children", man:"men", woman:"women", foot:"feet", tooth:"teeth", mouse:"mice", person:"people", sheep:"sheep", fish:"fish", deer:"deer" },
  ed: { run:"ran", go:"went", eat:"ate", come:"came", get:"got", make:"made", take:"took", see:"saw", say:"said", sit:"sat", drink:"drank", ride:"rode", sleep:"slept", hear:"heard", think:"thought", find:"found", feel:"felt", have:"had", do:"did", is:"was", are:"were", give:"gave", know:"knew", sing:"sang", swim:"swam", fall:"fell", tell:"told", buy:"bought", catch:"caught", hold:"held", wear:"wore", write:"wrote", draw:"drew", break:"broke", speak:"spoke", stand:"stood", win:"won", fly:"flew", put:"put", read:"read", swing:"swung" },
  en: { eat:"eaten", take:"taken", give:"given", see:"seen", break:"broken", speak:"spoken", write:"written", go:"gone", do:"done", know:"known", fall:"fallen", draw:"drawn", ride:"ridden", wear:"worn", get:"gotten", come:"come", run:"run" },
  er: { good:"better", bad:"worse", far:"farther", many:"more", little:"less" },
  est:{ good:"best", bad:"worst", far:"farthest", many:"most", little:"least" },
  ing:{ be:"being", see:"seeing", open:"opening", listen:"listening", happen:"happening", visit:"visiting", travel:"traveling", run:"running", swim:"swimming", sit:"sitting", get:"getting", put:"putting", cut:"cutting", stop:"stopping" }
};
/* ===== [GRAMMAR] ===== */
function applySuffix(word, sfx){
  var w = word;
  var lw = w.toLowerCase();
  if (IRR[sfx] && IRR[sfx][lw]) return IRR[sfx][lw];
  function cy(){ return /[^aeiou]y$/.test(w); }
  if (sfx === "s"){ if (/(s|x|z|ch|sh)$/.test(w)) return w+"es"; if (cy()) return w.slice(0,-1)+"ies"; return w+"s"; }
  if (sfx === "ed"){ if (/e$/.test(w)) return w+"d"; if (cy()) return w.slice(0,-1)+"ied"; return w+"ed"; }
  if (sfx === "en"){ if (/e$/.test(w)) return w+"n"; return w+"en"; }
  if (sfx === "ing"){ if (/[^aeiou]e$/.test(w)) return w.slice(0,-1)+"ing"; if (/[^aeiouwxy][aeiou][^aeiouwxy]$/.test(w)) return w+w.slice(-1)+"ing"; return w+"ing"; }
  if (sfx === "er"){ if (/e$/.test(w)) return w+"r"; if (cy()) return w.slice(0,-1)+"ier"; return w+"er"; }
  if (sfx === "est"){ if (/e$/.test(w)) return w+"st"; if (cy()) return w.slice(0,-1)+"iest"; return w+"est"; }
  if (sfx === "ly"){ if (cy()) return w.slice(0,-1)+"ily"; return w+"ly"; }
  return w + sfx;
}

        var lc = palColors(b.c);
        d.className = "cell locked";
        d.style.setProperty("--tile", lc[0]);
        d.style.setProperty("--edge", lc[1]);
        d.innerHTML = '<div class="pic">'+picHTML(b)+'</div><div class="lab">'+esc(b.l)+'</div><span class="lvtag">L'+(b.lv||2)+'</span>';

        d.addEventListener("click", function(){ if (suppressClick) return; openEditor(idx, b); });
        grid.appendChild(d); return;
      }

        d.className = "cell empty" + (editing ? " editing" : "");
        if (editing) d.addEventListener("click", function(){ if (suppressClick) return; openEditor(idx, null); });
        grid.appendChild(d); return;
      }

      d.className = "cell";

/* ---------- drag & drop rearranging (edit mode only) ---------- */
var dragCand = null, dragGhost = null, dragOn = false, suppressClick = false;
function dragStartCand(e, idx, el){
  if (!editing) return;
  var t = (e.touches && e.touches[0]) || e;
  dragCand = { x: t.clientX, y: t.clientY, idx: idx, el: el };
}
function dragMove(e){
  if (!dragCand || !editing) return;
  var t = (e.touches && e.touches[0]) || e;
  if (!dragOn){
    if (Math.abs(t.clientX - dragCand.x) + Math.abs(t.clientY - dragCand.y) < 12) return;
    dragOn = true;
    var r = dragCand.el.getBoundingClientRect();
    dragGhost = dragCand.el.cloneNode(true);
    dragGhost.style.cssText = "position:fixed;width:"+r.width+"px;height:"+r.height+"px;z-index:100;pointer-events:none;opacity:.85;margin:0";
    document.body.appendChild(dragGhost);
    dragCand.el.style.opacity = .3;
  }
  if (e.cancelable) e.preventDefault();
  dragGhost.style.left = (t.clientX - dragGhost.offsetWidth/2) + "px";
  dragGhost.style.top  = (t.clientY - dragGhost.offsetHeight/2) + "px";
}
function dragEnd(e){
  if (!dragCand) return;
  if (!dragOn){ dragCand = null; return; }
  var t = (e.changedTouches && e.changedTouches[0]) || e;
  var el = document.elementFromPoint(t.clientX, t.clientY);
  while (el && !(el.classList && el.classList.contains("cell"))) el = el.parentElement;
  if (el && el.dataset && el.dataset.idx !== undefined){
    var s = dragCand.idx, tg = parseInt(el.dataset.idx, 10);
    if (!isNaN(tg) && tg !== s){
      var cells = board.pages[cur].cells;
      var moving = cells[s], other = cells[tg];
      if (moving){
        if (other) cells[s] = other; else delete cells[s];
        cells[tg] = moving;
        save();
        toast(other ? "Swapped the two buttons." : "Moved.");
      }
    }
  }
  if (dragGhost && dragGhost.parentElement) dragGhost.parentElement.removeChild(dragGhost);
  dragGhost = null; dragOn = false; dragCand = null;
  suppressClick = true;
  setTimeout(function(){ suppressClick = false; }, 350);
  render();
}
if (window.PointerEvent){
  document.addEventListener("pointermove", dragMove, { passive: false });
  document.addEventListener("pointerup", dragEnd);
} else {
  document.addEventListener("touchmove", dragMove, { passive: false });
  document.addEventListener("touchend", dragEnd);
}
function tapButton(idx, b){
  if (editing){ openEditor(idx, b); return; }
  /* press-and-hold filter: ignore quick accidental brushes */
  if (board.settings.hold && (Date.now() - lastDown) < board.settings.hold) return;
  if (b.t === "a"){
    if (b.a === "clear"){ sent = []; renderSent(); }
    else if (b.a === "back"){ goBack(); }
    else if (b.a === "spell"){ openSpell(); }
    return;
  }
  if (b.t === "g"){
    if (!sent.length) return;
    var last = sent[sent.length-1];
    var neu = applySuffix(last.say, b.sfx.replace(/^\+/,""));
    last.say = neu; last.l = neu; last.au = null;
    renderSent();
    if (board.settings.instant) speak(neu);
    return;
  }
  if (b.t === "f"){
    if (b.sp){ pushWord(b); }
    stack.push(cur); cur = b.tg;
    if (!board.pages[cur]){ board.pages[cur] = stubPage(b.l); save(); }
    render();
    return;
  }
  pushWord(b);
  guideCheck(cur, idx);
  /* motor-plan: after choosing a word, return to the core/home page (LAMP / TD Snap style) */
  if (board.settings.motorReturn && !guide && cur !== startPage()){ cur = startPage(); stack = []; render(); }
}
function pushWord(b){
  var it = { l:b.l, say:(b.s || b.l), e:b.e, img:b.img, au:(b.au || null), c:(b.c || "w") };
  sent.push(it);
  renderSent();
  if (board.settings.instant) playItems([it]);
}
function goBack(){
  if (stack.length){ cur = stack.pop(); } else { cur = startPage(); }
  render();
}
function renderSent(){
  sentEl.innerHTML = "";
  if (!sent.length){ sentEl.innerHTML = '<span class="hint">Tap words to talk…</span>'; return; }
  sent.forEach(function(it, i){
    var c = document.createElement("div");
    c.className = "chip";
    var pc = palColors(it.c || "w");
    c.style.background = pc[0];
    c.style.setProperty("--edge", pc[1]);
    var pic = (it.img && (it.img.d || it.img.u))
      ? '<img src="'+(it.img.d || it.img.u)+'" alt="">'
      : '<span class="em">'+(it.e||"")+'</span>';
    c.innerHTML = pic + '<span>'+esc(it.l)+'</span>';
    c.addEventListener("click", function(){ sent.splice(i,1); renderSent(); });
    sentEl.appendChild(c);
  });
  sentEl.scrollLeft = sentEl.scrollWidth;
}

/* ---------- spelling keyboard ---------- */
var spellMode = "abc";
var PHON = { a:"ah", b:"buh", c:"kuh", d:"duh", e:"eh", f:"fuh", g:"gah", h:"huh", i:"ih", j:"juh", k:"kuh", l:"luh", m:"muh", n:"nuh", o:"aw", p:"puh", q:"kwuh", r:"ruh", s:"suh", t:"tuh", u:"uh", v:"vuh", w:"wuh", x:"kuhs", y:"yuh", z:"zuh" };
var LONGV = [["ā","ay"],["ē","ee"],["ī","eye"],["ō","oh"],["ū","you"]];
var PUNCT = [[".","period"],["?","question mark"],["!","exclamation mark"],[",","comma"],["'","apostrophe"],[":","colon"],[";","semicolon"]];
/* ===== [KEYBOARD] ===== */
function openSpell(){
  spellBuf = "";
  spellMode = "abc";
  drawSpell();
}
function drawSpell(){
  var tabs = [["abc","ABC"],["phon","Phonics"],["num","123"],["punct","?! ."]];
  var tabHtml = tabs.map(function(t){
    return '<button class="' + (spellMode===t[0] ? "on" : "") + '" data-m="'+t[0]+'">'+t[1]+'</button>';
  }).join("");
  function key(label, val){ return '<button class="spk2" data-v="'+val+'">'+label+'</button>'; }
  var keys = "";
  if (spellMode === "num"){
    keys = '<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px">' +
      "1234567890".split("").map(function(d){ return key(d,d); }).join("") + '</div>' +
      '<div class="note">Digits chain into one number: 1, then 12, then 123.</div>';
  } else if (spellMode === "punct"){
    keys = '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px">' +
      PUNCT.map(function(p){ return key(p[0], p[0]); }).join("") + '</div>' +
      '<div class="note">Punctuation changes how the sentence sounds — a ? makes it a question.</div>';
  } else if (board.settings.kbLayout === "abc"){
    var seq = [];
    "abcdefghijklmnopqrstuvwxyz".split("").forEach(function(ch){
      seq.push([ch, ch]);
      if (spellMode === "phon"){
        for (var li = 0; li < LONGV.length; li++){
          if (LONGV[li][0].normalize("NFD")[0] === ch) seq.push([LONGV[li][0], "LV:" + LONGV[li][1]]);
        }
      }
    });
    keys = '<div style="display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:5px">' +
      seq.map(function(p){
        var hint = "";
        if (spellMode === "phon"){
          var h = p[1].indexOf("LV:") === 0 ? p[1].slice(3) : (PHON[p[0]] || "");
          hint = '<div style="font-size:9px;color:var(--muted);font-weight:600">' + h + '</div>';
        }
        return '<button class="spk2" data-v="' + p[1] + '" style="max-width:52px;min-width:40px"><div>' + p[0] + '</div>' + hint + '</button>';
      }).join("") + '</div>';
    if (spellMode === "phon") keys += '<div class="note">ABC order — every key shows its sound, and marked vowels (ā ē ī ō ū) sit next to their letter.</div>';
  } else {
    var qrows = ["qwertyuiop","asdfghjkl","zxcvbnm"];
    keys = qrows.map(function(r, i){
      return '<div style="display:flex;gap:5px;justify-content:center;margin-top:5px' + (i===2 ? ';padding:0 8%' : (i===1 ? ';padding:0 4%' : '')) + '">' +
        r.split("").map(function(ch){ return key(ch, ch); }).join("") + '</div>';
    }).join("");
    if (spellMode === "phon"){
      keys += '<div style="display:flex;gap:5px;justify-content:center;margin-top:8px">' +
        LONGV.map(function(v){ return key(v[0], "LV:"+v[1]); }).join("") + '</div>' +
        '<div class="note">Letters make their sounds. Top-marked vowels say their long sound.</div>';
    }
  }
  openOv('<h3>🔤 Keyboard <button id="kblay" style="float:right;border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:700;cursor:pointer">' + (board.settings.kbLayout === "abc" ? "ABC → QWERTY" : "QWERTY → ABC") + '</button></h3>' +
    '<div id="spbuf" style="min-height:42px;font-size:24px;letter-spacing:1px;text-align:center;border:1px solid var(--border);border-radius:12px;padding:7px">'+esc(spellBuf)+'</div>' +
    '<div class="tabs" id="sptabs">'+tabHtml+'</div>' +
    '<div id="spkeys">'+keys+'</div>' +
    '<div style="display:flex;gap:6px;margin-top:10px">' +
      '<button class="btn ghost" id="spsp" style="flex:2">␣ Space</button>' +
      '<button class="btn ghost" id="spbk" style="flex:1">⌫</button>' +
      '<button class="btn ghost" id="sphear" style="flex:1">🔊</button></div>' +
    '<div class="btnrow"><button class="btn" id="spc">Cancel</button><button class="btn primary" id="spok">OK — say it</button></div>');
  Array.prototype.forEach.call(ovbox.querySelectorAll("#sptabs button"), function(bt){
    bt.addEventListener("click", function(){ spellMode = bt.getAttribute("data-m"); drawSpell(); });
  });
  ovbox.querySelector("#kblay").addEventListener("click", function(){
    board.settings.kbLayout = board.settings.kbLayout === "abc" ? "qwerty" : "abc";
    save(); drawSpell();
  });
  function upd(){ ovbox.querySelector("#spbuf").textContent = spellBuf; }
  Array.prototype.forEach.call(ovbox.querySelectorAll(".spk2"), function(bt){
    bt.addEventListener("click", function(){
      var v = bt.getAttribute("data-v");
      if (v.indexOf("LV:") === 0){ speak(v.slice(3)); return; }
      if (spellMode === "num"){
        spellBuf += v;
        var m = spellBuf.match(/(\d+)$/);
        speak(m ? m[1] : v);
      } else if (spellMode === "punct"){
        spellBuf += v;
        var pn = v;
        for (var i2 = 0; i2 < PUNCT.length; i2++) if (PUNCT[i2][0] === v) pn = PUNCT[i2][1];
        speak(pn);
      } else if (spellMode === "phon"){
        spellBuf += v;
        speak(PHON[v] || v);
      } else {
        spellBuf += v;
        speak(v);
      }
      upd();
    });
  });
  ovbox.querySelector("#spsp").addEventListener("click", function(){ spellBuf += " "; upd(); });
  ovbox.querySelector("#spbk").addEventListener("click", function(){ spellBuf = spellBuf.slice(0,-1); upd(); });
  ovbox.querySelector("#sphear").addEventListener("click", function(){ if (spellBuf) speak(spellBuf); });
  ovbox.querySelector("#spc").addEventListener("click", closeOv);
  ovbox.querySelector("#spok").addEventListener("click", function(){
    var t = spellBuf.trim();
    if (t){
      sent.push({ l:t, say:t, e:"🔤", img:null, c:"w" });
      renderSent();
      if (board.settings.instant) speak(t);
    }
    closeOv();
  });
}

/* ---------- ARASAAC ---------- */
/* ===== [SYMBOLS] ===== */
function arasaacSearch(q, cb){
  var url = "https://api.arasaac.org/api/pictograms/en/search/" + encodeURIComponent(q);
  fetch(url).then(function(r){ return r.ok ? r.json() : []; }).then(function(list){
    list = (list || []).slice();
    var ql = String(q).toLowerCase().trim();
    function score(it){
      var exact = (it.keywords || []).some(function(k){ return String(k.keyword || "").toLowerCase().trim() === ql; });
      return (exact ? 4 : 0) + (it.aac ? 2 : 0) + (it.aacColor ? 1 : 0);
    }
    list = list.map(function(it, i){ return { it: it, i: i, s: score(it) }; })
      .sort(function(a, b2){ return (b2.s - a.s) || (a.i - b2.i); })
      .map(function(x){ return x.it; });
    cb(list.slice(0, 16).map(function(it){
      return "https://static.arasaac.org/pictograms/" + it._id + "/" + it._id + "_300.png";
    }));
  }).catch(function(){ cb(null); });
}
function urlToDataURL(url, maxPx, cb){
  fetch(url).then(function(r){ return r.blob(); }).then(function(blob){
    var fr = new FileReader();
    fr.onload = function(){
      var img = new Image();
      img.onload = function(){
        var sc = Math.min(1, maxPx / Math.max(img.width, img.height));
        var cv = document.createElement("canvas");
        cv.width = Math.round(img.width*sc); cv.height = Math.round(img.height*sc);
        cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
        try { cb(cv.toDataURL("image/png")); } catch(e){ cb(null); }
      };
      img.onerror = function(){ cb(null); };
      img.src = fr.result;
    };
    fr.onerror = function(){ cb(null); };
    fr.readAsDataURL(blob);
  }).catch(function(){ cb(null); });
}

/* ---------- bulk symbol download ---------- */
/* ---------- built-in symbols: the device fills in ARASAAC symbols by itself ----------
   First launch (and after a reset), every word or folder without a picture gets the top
   ARASAAC match in the background. Symbols are stored as URLs (small, sync-friendly) and
   the service worker keeps a copy of each image so they work offline. */
var autoSymRunning = false;
function autoSymbols(){
  if (autoSymRunning || !board || board.symAuto) return;
  if (!navigator.onLine){ window.addEventListener("online", autoSymbols, { once:true }); return; }
  var queue = [];
  Object.keys(board.pages).forEach(function(pk){
    var cells = board.pages[pk].cells;
    Object.keys(cells).forEach(function(ci){
      var b = cells[ci];
      if (b && (b.t === "w" || b.t === "f") && !b.img) queue.push(b);
    });
  });
  if (!queue.length){ board.symAuto = true; save(); return; }
  autoSymRunning = true;
  var i = 0, sinceRender = 0, fails = 0;
  function step(){
    if (i >= queue.length || fails > 12){
      autoSymRunning = false;
      if (fails <= 12) board.symAuto = true;
      save(); render(); return;
    }
    var b = queue[i++];
    if (b.img){ setTimeout(step, 0); return; }             /* someone picked one meanwhile */
    arasaacSearch(b.l, function(urls){
      if (urls === null) fails++;
      if (urls && urls.length && !b.img){
        b.img = { u: urls[0] };
        warmSymbol(urls[0]);
        if (++sinceRender >= 12){ sinceRender = 0; save(); render(); }
      }
      setTimeout(step, 60);
    });
  }
  step();
}
/* fetch once with CORS so the service worker stores a real (non-opaque) copy for offline use */
function warmSymbol(u){ try { fetch(u, { mode:"cors" }).catch(function(){}); } catch(e){} }
function bulkSymbols(){
  var queue = [];
  Object.keys(board.pages).forEach(function(pk){
    var cells = board.pages[pk].cells;
    Object.keys(cells).forEach(function(ci){
      var b = cells[ci];
      if (b && (b.t==="w" || b.t==="f") && !(b.img && b.img.d)) queue.push(b);
    });
  });
  if (!queue.length){ toast("All buttons already have symbols."); return; }
  openOv('<h3>Getting real symbols</h3><p class="sub">Downloading from ARASAAC and saving on this device so they work offline.</p>' +
    '<div id="bp" style="font-size:15px;font-weight:600">0 / '+queue.length+'</div>' +
    '<div style="height:10px;background:var(--soft);border-radius:99px;margin-top:8px"><div id="bbar" style="height:10px;width:0%;background:var(--accent);border-radius:99px"></div></div>' +
    '<div class="btnrow"><button class="btn" id="bstop">Stop</button></div>');
  var i = 0, stopped = false, got = 0;
  ovbox.querySelector("#bstop").addEventListener("click", function(){ stopped = true; closeOv(); save(); render(); });
  function step(){
    if (stopped) return;
    if (i >= queue.length){
      save(); render(); closeOv();
      toast("Done — "+got+" symbols saved for offline use.");
      return;
    }
    var b = queue[i++];
    var el1 = ovbox.querySelector("#bp"), el2 = ovbox.querySelector("#bbar");
    if (el1){ el1.textContent = i+" / "+queue.length+"  ("+esc(b.l)+")"; el2.style.width = Math.round(i/queue.length*100)+"%"; }
    arasaacSearch(b.l, function(urls){
      if (urls && urls.length){
        urlToDataURL(urls[0], 220, function(durl){
          if (durl){ b.img = { d:durl }; got++; }
          setTimeout(step, 120);
        });
      } else setTimeout(step, 120);
    });
  }
  step();
}

/* ---------- family sync (v2) ----------
   Firestore layout:
     k2_families/{fid}                  { owner, created }
     k2_families/{fid}/members/{uid}    { role, device, joined, code? }   only members can read/write the family
     k2_families/{fid}/pages/{pk}       { pk, p (JSON: name/cols/rows), src, t }
     k2_families/{fid}/cells/{pk~idx}   { pk, i, b (JSON button), src, t }  one document per button
     k2_families/{fid}/media/{id}       { d }   family photos + recorded voices
     k2_pairs/{code}                    { fid, by, exp }   15-minute pairing code shown as a QR
     k2_users/{uid}                     { fid, role, email }   account recovery

   overwrite each other. Edits made offline win when the device reconnects. */
var db = null, syncOn = false, unsubs = [], pushTimer = null, pushing = false, pushAgain = false;

function loadScript(src, cb){

var fbCbs = null;
/* ===== [SYNC] ===== */
function initFirebase(cb){
  if (db){ cb(null); return; }
  if (!dev.fb) dev.fb = DEFAULT_FB;
  if (fbCbs){ fbCbs.push(cb); return; }
  fbCbs = [cb];
  function done(err){ var q = fbCbs; fbCbs = null; q.forEach(function(f){ f(err); }); }
  var base = "https://www.gstatic.com/firebasejs/10.14.1/";
  loadScript(base+"firebase-app-compat.js", function(e1){
    if (e1){ done("Couldn’t load sync — check internet."); return; }
    loadScript(base+"firebase-auth-compat.js", function(e2){

      loadScript(base+"firebase-firestore-compat.js", function(e3){

        try {

          var au = firebase.auth(), settled = false;
          au.onAuthStateChanged(function(user){

            else { au.signInAnonymously().catch(function(err){ if (!settled){ settled = true; done("Sign-in failed: "+err.message+" — enable Anonymous sign-in in Firebase Authentication."); } }); }
          });

function isPermErr(e){ return e && (e.code === "permission-denied" || /permission/i.test(e.message || "")); }

/* stable JSON (sorted keys) so the same button always serializes to the same string */
function canon(v){
  if (v === null || typeof v !== "object") return JSON.stringify(v === undefined ? null : v);
  if (Array.isArray(v)) return "[" + v.map(canon).join(",") + "]";
  return "{" + Object.keys(v).sort().filter(function(k){ return v[k] !== undefined; })
    .map(function(k){ return JSON.stringify(k) + ":" + canon(v[k]); }).join(",") + "}";
}
function cellKey(pk, idx){ return pk + "~" + idx; }
function splitKey(k){ var j = k.lastIndexOf("~"); return [k.slice(0, j), parseInt(k.slice(j+1), 10)]; }
/* a button as it lives in the cloud: symbol URLs inline, photos/recordings by reference */
function cellOut(b, media){
  var c = JSON.parse(JSON.stringify(b));
  if (b.img && b.img.u) c.img = { u: b.img.u };
  else if (b.img && b.img.d){
    if (!b.img.id) b.img.id = genId("m");
    media[b.img.id] = b.img.d; c.img = { id: b.img.id };
  } else if (b.img && b.img.id) c.img = { id: b.img.id };
  else c.img = null;
  delete c.auId; delete c.auRef;
  if (b.au){
    if (!b.auId) b.auId = genId("a");
    media[b.auId] = b.au; c.au = null; c.auRef = b.auId;
  }
  return canon(c);
}
function pageOut(p){ return canon({ name: p.name, cols: p.cols || null, rows: p.rows || null }); }
function currentMap(media){
  var m = {};
  Object.keys(board.pages).forEach(function(pk){
    var p = board.pages[pk];
    m["P~" + pk] = pageOut(p);
    Object.keys(p.cells).forEach(function(ci){ if (p.cells[ci]) m[cellKey(pk, ci)] = cellOut(p.cells[ci], media); });
  });
  return m;
}

/* ----- push: send only what changed since the cloud last matched ----- */
function schedulePush(){
  if (!syncOn) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(pushChanges, 1200);
}
function pushChanges(){
  if (!syncOn || !db || !dev.fid) return;
  if (pushing){ pushAgain = true; return; }
  var media = {}, now = currentMap(media), ops = [];
  Object.keys(now).forEach(function(k){ if (shadow[k] !== now[k]) ops.push([k, now[k]]); });
  Object.keys(shadow).forEach(function(k){ if (!(k in now)) ops.push([k, null]); });
  try { localStorage.setItem(LS_KEY, JSON.stringify(board)); } catch(e){}   /* keeps new media ids */
  if (!ops.length){ setStatus("Synced ✓"); return; }
  pushing = true; setStatus("Syncing…");
  function finish(ok){
    pushing = false;
    saveShadow();
    if (!ok){ setStatus("Sync paused — will retry"); setTimeout(schedulePush, 15000); return; }
    setStatus("Synced ✓");
    if (pushAgain){ pushAgain = false; pushChanges(); }
  }
  var mids = Object.keys(media).filter(function(id){ return !pushedIds[id]; });
  var mi = 0;
  (function nextMedia(){
    if (mi < mids.length){
      var id = mids[mi++];
      fam().collection("media").doc(id).set({ d: media[id] })
        .then(function(){ pushedIds[id] = 1; nextMedia(); })
        .catch(function(){ finish(false); });
      return;
    }
    var chunks = [];
    for (var i = 0; i < ops.length; i += 400) chunks.push(ops.slice(i, i + 400));
    var ci = 0;
    (function nextChunk(){
      if (ci >= chunks.length){ finish(true); return; }
      var ch = chunks[ci++], batch = db.batch(), t = Date.now();
      ch.forEach(function(op){
        var k = op[0], v = op[1];
        if (k.indexOf("P~") === 0){
          var pref = fam().collection("pages").doc(k.slice(2));
          if (v === null) batch.delete(pref); else batch.set(pref, { pk: k.slice(2), p: v, src: dev.id, t: t });
        } else {
          var sk = splitKey(k), cref = fam().collection("cells").doc(k);
          if (v === null) batch.delete(cref); else batch.set(cref, { pk: sk[0], i: sk[1], b: v, src: dev.id, t: t });
        }
      });
      batch.commit().then(function(){
        ch.forEach(function(op){ if (op[1] === null) delete shadow[op[0]]; else shadow[op[0]] = op[1]; });
        nextChunk();
      }).catch(function(e){ if (isPermErr(e)) lostAccess(); finish(false); });
    })();
  })();
}

/* ----- pull: apply other devices' changes button by button ----- */
var mediaWait = {}, dirtyAtStart = null, remoteTimer = null;
function fetchMedia(id, cb){
  if (mediaWait[id]){ mediaWait[id].push(cb); return; }
  mediaWait[id] = [cb];
  fam().collection("media").doc(id).get().then(function(s){
    var d = s.exists ? s.data().d : null, q = mediaWait[id]; delete mediaWait[id];
    if (d) pushedIds[id] = 1;
    q.forEach(function(f){ f(d); });
  }).catch(function(){ delete mediaWait[id]; });
}
function resolveCellMedia(b, old){
  if (b.img && b.img.id && !b.img.d){
    if (old && old.img && old.img.id === b.img.id && old.img.d) b.img.d = old.img.d;
    else fetchMedia(b.img.id, function(d){ if (d && b.img){ b.img.d = d; remoteChanged(); } });
  }
  if (b.auRef){
    b.auId = b.auRef; delete b.auRef;
    if (old && old.auId === b.auId && old.au) b.au = old.au;
    else fetchMedia(b.auId, function(d){ if (d){ b.au = d; remoteChanged(); } });
  }
}
function remoteChanged(){
  clearTimeout(remoteTimer);
  remoteTimer = setTimeout(function(){
    var j = JSON.stringify(board);
    try { localStorage.setItem(LS_KEY, j); } catch(e){}
    idbSet(LS_KEY, j);
    saveShadow();
    if (!board.pages[cur]){ cur = startPage(); stack = []; }
    render();
  }, 250);
}
function applyRemote(kind, ch){
  var d = ch.doc.data(), key = kind === "pages" ? "P~" + d.pk : cellKey(d.pk, d.i);
  if (dirtyAtStart && dirtyAtStart[key]) return;         /* this device's offline edit wins */
  if (ch.type === "removed"){
    if (!(key in shadow)) return;
    delete shadow[key];
    if (kind === "cells" && board.pages[d.pk]) delete board.pages[d.pk].cells[d.i];
    remoteChanged(); return;
  }
  var val = kind === "pages" ? d.p : d.b;
  if (shadow[key] === val) return;                        /* our own write echoing back */
  shadow[key] = val;
  if (kind === "pages"){
    var pm = JSON.parse(val), pg = board.pages[d.pk] || (board.pages[d.pk] = { name: pm.name, cells: {} });
    pg.name = pm.name;
    if (pm.cols) pg.cols = pm.cols; else delete pg.cols;
    if (pm.rows) pg.rows = pm.rows; else delete pg.rows;
  } else {
    var b = JSON.parse(val);
    if (!board.pages[d.pk]) board.pages[d.pk] = { name: d.pk, cells: {} };
    resolveCellMedia(b, board.pages[d.pk].cells[d.i]);
    board.pages[d.pk].cells[d.i] = b;
  }

function stopListen(){ unsubs.forEach(function(u){ try { u(); } catch(e){} }); unsubs = []; }
function startListen(){

  var now = currentMap({});
  dirtyAtStart = {};
  Object.keys(now).forEach(function(k){ if (shadow[k] !== now[k]) dirtyAtStart[k] = 1; });
  Object.keys(shadow).forEach(function(k){ if (!(k in now)) dirtyAtStart[k] = 1; });
  var pending = 2;
  ["pages", "cells"].forEach(function(kind){
    var first = true;
    unsubs.push(fam().collection(kind).onSnapshot(function(snap){
      snap.docChanges().forEach(function(ch){ try { applyRemote(kind, ch); } catch(e){} });
      if (first){
        first = false;
        if (--pending === 0){ dirtyAtStart = null; setStatus("Synced ✓"); pushChanges(); }
      }
    }, function(err){
      if (isPermErr(err)) lostAccess();
      else setStatus("Sync offline — device still works");
    }));
  });
}
function lostAccess(){
  stopListen(); syncOn = false;
  setStatus("Not connected — this device was removed from the family");
}

/* ----- family: create, pair, join, leave, delete ----- */
function newFamilyCode(){
  var a = "ABCDEFGHJKMNPQRSTUVWXYZ23456789", c = "";
  for (var i = 0; i < 8; i++) c += a[Math.floor(Math.random() * a.length)];
  return c;
}
function resetSyncState(){ shadow = {}; pushedIds = {}; saveShadow(); }
function createFamily(role, cb){
  initFirebase(function(err){
    if (err){ cb(err); return; }
    var uid = myUid(), fid = genId("f") + Math.random().toString(36).slice(2, 8);
    fam(fid).set({ owner: uid, created: Date.now() }).then(function(){
      return fam(fid).collection("members").doc(uid).set({ role: role, device: dev.id, joined: Date.now() });
    }).then(function(){
      dev.fid = fid; dev.role = role; dev.owner = true; saveDev();
      resetSyncState();
      syncOn = true; saveUserProfile(); startListen(); cb(null);
    }).catch(function(e){ cb("Couldn’t create the family: " + (e.message || e)); });
  });
}
function makePairCode(cb){
  var code = newFamilyCode();
  db.collection("k2_pairs").doc(code).set({
    fid: dev.fid, by: myUid(), exp: firebase.firestore.Timestamp.fromMillis(Date.now() + 15 * 60000)
  }).then(function(){ cb(null, code); }).catch(function(e){ cb(e.message || "Couldn’t make a code."); });
}
/* replace this device's pages with the family's board */
function loadFamilyBoard(fid, cb){
  Promise.all([fam(fid).collection("pages").get(), fam(fid).collection("cells").get()]).then(function(r){
    var pages = {}, sh = {};
    r[0].forEach(function(doc){
      var d = doc.data(), pm = JSON.parse(d.p);
      pages[d.pk] = { name: pm.name, cells: {} };
      if (pm.cols) pages[d.pk].cols = pm.cols;
      if (pm.rows) pages[d.pk].rows = pm.rows;
      sh["P~" + d.pk] = d.p;
    });
    r[1].forEach(function(doc){
      var d = doc.data(), b = JSON.parse(d.b);
      if (!pages[d.pk]) pages[d.pk] = { name: d.pk, cells: {} };
      pages[d.pk].cells[d.i] = b;
      sh[cellKey(d.pk, d.i)] = d.b;
    });
    if (!pages.home){ cb("That family doesn’t have a board yet — open Kite on the iPad first."); return; }
    board.pages = pages; board.symAuto = true;
    shadow = sh; pushedIds = {};
    Object.keys(pages).forEach(function(pk){
      Object.keys(pages[pk].cells).forEach(function(ci){ resolveCellMedia(pages[pk].cells[ci], null); });
    });
    ensureShape();
    var j = JSON.stringify(board);
    try { localStorage.setItem(LS_KEY, j); } catch(e){}
    idbSet(LS_KEY, j); saveShadow();
    cur = startPage(); stack = []; render();
    cb(null);
  }).catch(function(e){ cb(isPermErr(e) ? "This device isn’t a member of that family." : "Couldn’t load the board: " + (e.message || e)); });
}
function joinWithCode(code, role, cb){
  initFirebase(function(err){
    if (err){ cb(err); return; }
    var fid = null;
    db.collection("k2_pairs").doc(code).get().then(function(snap){
      if (!snap.exists) throw new Error("That code isn’t valid — make a new one on the iPad.");
      var p = snap.data();
      if (p.exp && p.exp.toMillis && p.exp.toMillis() < Date.now()) throw new Error("That code expired — make a new one on the iPad.");
      fid = p.fid;
      return fam(fid).collection("members").doc(myUid()).set({ role: role, device: dev.id, joined: Date.now(), code: code });
    }).then(function(){
      loadFamilyBoard(fid, function(e2){
        if (e2){ cb(e2); return; }
        dev.fid = fid; dev.role = role; dev.owner = false; saveDev();
        syncOn = true; saveUserProfile(); startListen(); cb(null);
      });
    }).catch(function(e){ cb(isPermErr(e) ? "That code didn’t work — make a new one on the iPad." : (e.message || "Couldn’t join.")); });
  });
}
function leaveFamily(cb){
  var fid = dev.fid, uid = myUid();
  stopListen(); syncOn = false;
  dev.fid = null; dev.owner = false; saveDev(); resetSyncState(); setStatus("");
  if (db && fid && uid) fam(fid).collection("members").doc(uid).delete().then(function(){ cb(null); }).catch(function(){ cb(null); });
  else cb(null);
}
/* owner only: remove every trace of the family from the cloud */
function deleteFamily(cb){
  var fid = dev.fid, uid = myUid();
  stopListen(); syncOn = false;
  function wipe(sub){
    return fam(fid).collection(sub).get().then(function(q){
      var docs = [];
      q.forEach(function(d){ if (!(sub === "members" && d.id === uid)) docs.push(d.ref); });
      var p = Promise.resolve();
      for (var i = 0; i < docs.length; i += 400){
        (function(slice){ p = p.then(function(){ var b = db.batch(); slice.forEach(function(r){ b.delete(r); }); return b.commit(); }); })(docs.slice(i, i + 400));
      }
      return p;
    });
  }
  wipe("cells").then(function(){ return wipe("pages"); }).then(function(){ return wipe("media"); })
    .then(function(){ return wipe("members"); })
    .then(function(){ return fam(fid).delete(); })
    .then(function(){ return fam(fid).collection("members").doc(uid).delete(); })
    .then(function(){ return db.collection("k2_users").doc(uid).delete().catch(function(){}); })
    .then(function(){ dev.fid = null; dev.owner = false; saveDev(); resetSyncState(); setStatus(""); cb(null); })
    .catch(function(e){ cb("Couldn’t finish deleting: " + (e.message || e) + " — try again."); });
}

/* ----- optional account: keeps the same identity on a new device ----- */
function friendlyAuth(e){
  var c = (e && e.code) || "";
  if (c === "auth/email-already-in-use") return "That email already has an account — use Sign in instead.";
  if (c === "auth/wrong-password" || c === "auth/invalid-credential") return "Wrong email or password.";
  if (c === "auth/user-not-found") return "No account with that email yet — create one instead.";
  if (c === "auth/invalid-email") return "That does not look like a valid email.";
  if (c === "auth/weak-password") return "Password should be at least 6 characters.";
  if (c === "auth/popup-blocked" || c === "auth/popup-closed-by-user" || c === "auth/cancelled-popup-request") return "Google sign-in was closed — try again.";
  if (c === "auth/operation-not-allowed") return "That sign-in method isn’t enabled in Firebase yet.";
  return (e && e.message) || "Something went wrong.";
}
function saveUserProfile(){
  try {
    var u = firebase.auth().currentUser;
    if (!db || !u || u.isAnonymous) return;
    db.collection("k2_users").doc(u.uid).set({ email: u.email || null, role: dev.role || "child", fid: dev.fid || null, updated: Date.now() }, { merge: true });
  } catch(e){}
}
function recoverProfile(cb){
  try {
    var u = firebase.auth().currentUser;
    if (!db || !u){ cb(null); return; }
    db.collection("k2_users").doc(u.uid).get().then(function(snap){
      var d = snap.exists ? snap.data() : null;
      if (d && d.fid && !dev.fid){
        setStatus("Restoring your board…");
        loadFamilyBoard(d.fid, function(e2){
          if (!e2){ dev.fid = d.fid; if (d.role) dev.role = d.role; saveDev(); syncOn = true; startListen(); }
          cb(null);
        });
      } else { saveUserProfile(); cb(null); }
    }).catch(function(){ cb(null); });
  } catch(e){ cb(null); }
}
function signUpEmail(email, pass, cb){
  initFirebase(function(err){
    if (err){ cb(err); return; }
    var au = firebase.auth(), u = au.currentUser;
    function after(){ saveUserProfile(); cb(null); }
    try {
      var cred = firebase.auth.EmailAuthProvider.credential(email, pass);
      if (u && u.isAnonymous){
        /* linking keeps the same identity, so this device stays a family member */
        u.linkWithCredential(cred).then(after).catch(function(er){
          if (er.code === "auth/email-already-in-use" || er.code === "auth/credential-already-in-use") cb("That email already has an account — use Sign in instead.");
          else cb(friendlyAuth(er));
        });
      } else {
        au.createUserWithEmailAndPassword(email, pass).then(after).catch(function(er){ cb(friendlyAuth(er)); });
      }
    } catch(er){ cb(friendlyAuth(er)); }
  });
}
function signInEmail(email, pass, cb){
  initFirebase(function(err){
    if (err){ cb(err); return; }
    firebase.auth().signInWithEmailAndPassword(email, pass).then(function(){ recoverProfile(cb); }).catch(function(er){ cb(friendlyAuth(er)); });
  });
}
function signInGoogle(cb){
  initFirebase(function(err){
    if (err){ cb(err); return; }
    var au = firebase.auth(), u = au.currentUser, prov = new firebase.auth.GoogleAuthProvider();
    var op = (u && u.isAnonymous) ? u.linkWithPopup(prov) : au.signInWithPopup(prov);
    op.then(function(){ saveUserProfile(); recoverProfile(cb); }).catch(function(er){
      if (er.code === "auth/credential-already-in-use" || er.code === "auth/email-already-in-use"){
        au.signInWithPopup(prov).then(function(){ recoverProfile(cb); }).catch(function(x){ cb(friendlyAuth(x)); });
      } else cb(friendlyAuth(er));
    });
  });
}
function signOutAcct(cb){
  /* signing out changes this device's identity, so it also disconnects from the family */
  stopListen(); syncOn = false; dev.fid = null; dev.owner = false; saveDev(); resetSyncState(); setStatus("");
  try { firebase.auth().signOut().then(function(){ firebase.auth().signInAnonymously().then(function(){ if(cb)cb(); }).catch(function(){ if(cb)cb(); }); }).catch(function(){ if(cb)cb(); }); }
  catch(e){ if(cb)cb(); }
}

/* ---------- word index + guided path (used by Word Finder) ---------- */
function wordIndex(){
  var ix = {};
  Object.keys(board.pages).forEach(function(pk){
    var cs = board.pages[pk].cells;
    Object.keys(cs).forEach(function(ci){
      var b = cs[ci];
      if (b && b.t === "w" && pk !== "l1" && shown(b, pk)){
        var k = b.l.toLowerCase();
        if (!ix[k]) ix[k] = b;
      }
    });
  });
  return ix;
}
function tokenKey(t){ return t.toLowerCase().replace(/[^a-z0-9''-]/g,""); }
/* guided path: lights the real path on the board (Food -> apple) */
var guide = null;
function bfsPath(wordKey){
  var prev = { home: null }, q = ["home"];
  while (q.length){
    var p = q.shift();
    var cells = board.pages[p] ? board.pages[p].cells : {};
    var ci, b;
    for (ci in cells){
      b = cells[ci];
      if (!shown(b, p)) continue;
      if (b.t === "w" && b.l.toLowerCase() === wordKey){
        var steps = [{ page: p, idx: parseInt(ci,10) }];
        var node = p;
        while (prev[node]){ steps.unshift(prev[node]); node = prev[node].page; }
        return steps;
      }
    }
    for (ci in cells){
      b = cells[ci];
      if (b.t === "f" && shown(b, p) && board.pages[b.tg] && !(b.tg in prev)){
        prev[b.tg] = { page: p, idx: parseInt(ci,10) };
        q.push(b.tg);
      }
    }
  }
  return null;
}
function updateGuideBar(){
  var gb = document.getElementById("guidebar");
  if (!guide){ gb.style.display = "none"; gb.innerHTML = ""; return; }
  gb.style.display = "flex";
  gb.innerHTML = '🔍 <span>' + esc(guide.title) + '</span>&nbsp;·&nbsp;find: <span class="gword">' + esc(guide.toks[guide.pos]) + '</span>' +
    '<span style="color:var(--muted)">' + (guide.pos + 1) + ' / ' + guide.toks.length + '</span>' +
    '<button id="gstopb">✕ Stop</button>';
  document.getElementById("gstopb").addEventListener("click", endGuide);
}
function endGuide(){
  guide = null;
  updateGuideBar();
  render();
}
function advanceGuide(){
  var lead = [];
  while (true){
    guide.pos++;
    if (guide.pos >= guide.toks.length){
      if (lead.length) speak(lead.join(" "));
      finishGuide(); return;
    }
    var tok = guide.toks[guide.pos];
    var key = tokenKey(tok);
    var path = key ? bfsPath(key) : null;
    if (!path){ lead.push(tok); continue; }   /* words not on the board are read aloud automatically */
    guide.path = path;
    break;
  }
  var leadTxt = lead.join(" ");
  setTimeout(function(){
    if (!guide) return;
    var pr = true;
    if (leadTxt) speakAsync(leadTxt, function(){ if (guide && pr) speak("Find " + guide.toks[guide.pos]); });
    else if (pr) speak("Find " + guide.toks[guide.pos]);
  }, 1500);
  updateGuideBar();
  render();
}
function finishGuide(){
  guide = null; updateGuideBar(); render();
  toast("🎉 Found it!"); speak("You found it!");
}
function guideGlow(){
  var hb = document.getElementById("homeBtn");
  hb.classList.remove("guide-glow");
  if (!guide || !guide.path) return;
  var stepIdx = null;
  for (var i = 0; i < guide.path.length; i++){
    if (guide.path[i].page === cur){ stepIdx = guide.path[i].idx; break; }
  }
  if (stepIdx !== null){
    var el = grid.querySelector('[data-idx="' + stepIdx + '"]');
    if (el) el.classList.add("guide-glow");
    return;
  }
  var cells = board.pages[cur].cells, backIdx = null;
  Object.keys(cells).forEach(function(ci){
    if (backIdx === null && cells[ci].t === "a" && cells[ci].a === "back") backIdx = ci;
  });
  if (backIdx !== null){
    var el2 = grid.querySelector('[data-idx="' + backIdx + '"]');
    if (el2) el2.classList.add("guide-glow");
  } else hb.classList.add("guide-glow");
}
function guideCheck(pageAtTap, idx){
  if (!guide || !guide.path) return;
  var last = guide.path[guide.path.length - 1];
  if (pageAtTap === last.page && idx === last.idx) advanceGuide();
}

/* ---------- word finder ---------- */
document.getElementById("wfBtn").addEventListener("click", openWordFinder);
/* ===== [PRACTICE] ===== */
function openWordFinder(){
  var ix = wordIndex();
  var all = Object.keys(ix).sort();
  openOv('<h3>🔍 Word finder</h3><p class="sub">Type a word, tap it, then follow the glow to reach it. Great for helpers learning the board.</p>' +
    '<input type="text" id="wfq" placeholder="e.g. kiwi" autocomplete="off">' +
    '<div id="wfres" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;max-height:220px;overflow-y:auto"></div>' +
    '<div class="btnrow"><button class="btn" id="wfc">Close</button></div>');
  var res = ovbox.querySelector("#wfres");
  function show(list){
    res.innerHTML = "";
    list.slice(0, 18).forEach(function(k){
      var b = ix[k];
      var bt = document.createElement("button");
      bt.className = "btn ghost";
      bt.style.cssText = "flex:0 0 auto;padding:8px 12px;font-size:14px";
      bt.textContent = (b.e && b.e !== "⬜" ? b.e + " " : "") + b.l;
      bt.addEventListener("click", function(){ closeOv(); startWordGuide(b.l); });
      res.appendChild(bt);
    });
    if (!list.length) res.innerHTML = '<div class="note">That word isn’t on the board yet — add it in Edit mode.</div>';
  }
